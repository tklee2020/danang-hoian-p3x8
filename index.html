<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" id="themeColor" content="#DCEFF4">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다낭 호이안">

<link rel="preload" href="fonts/Jua-ko.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 글꼴: Pretendard 하나 (저장소에 파일로 — 오프라인에서도 같은 글꼴, 서비스워커가 저장) · SIL OFL 1.1 (fonts/LICENSE-Pretendard.txt) */
@font-face{font-family:'Pretendard';src:url('fonts/PretendardVariable.woff2') format('woff2');font-weight:45 920;font-style:normal;font-display:swap}

/* 화면: 파스텔 메시(화면에 고정) 위에 유리 타일 벤토. 글자는 유리 위가 아니라 타일 안의 불투명 카드 위에.
   포인트 색은 바다색 하나. 의미 표시(확인 필요 노랑 · 비상 반전 카드 · 가족 색)는 예외. (강화 "글래스 벤토"에서 가져옴)
   위: 배지·🚑·🌗 줄 + (오늘 탭이 아닐 때) 지금/다음 한 줄 → 화면별 큰 제목 → 타일들 → 아래 고정 유리 메뉴 */
:root{
  /* "only light" = 안드로이드 크롬 "사이트에 어두운 테마 적용"(강제 다크)이 밝은 화면을 덧칠하지 못하게.
     없으면 🌗 로 밝게 바꿔도 화면은 어둡게 남는다(속성은 바뀌어서 getComputedStyle 점검으로는 안 보임 — tools/qa/theme_pixels.js). */
  color-scheme:light; color-scheme:only light;
  --bg:#EEF6F5;
  /* 메시 4색: 하늘 · 민트 · 연노랑 · 살구 (RGB — 투명 끝점을 같은 색으로) */
  --m1:191,227,245; --m2:201,238,221; --m3:255,241,191; --m4:255,217,199;
  --glass:rgba(255,255,255,.55); --glass-fb:rgba(255,255,255,.86); --nav-glass:rgba(255,255,255,.72);
  --glass-line:rgba(255,255,255,.85);
  --glass-sh:0 10px 28px rgba(28,70,86,.10),0 1px 2px rgba(28,70,86,.06);
  --solid:#FFFFFF;
  --card:#FFFFFF; --card-line:rgba(16,36,43,0);
  --ink:#10242B; --ink-2:#3E525B; --ink-3:#5A6C74;
  --line:#DCE5E8; --chip:#EDF2F4; --chip-ink:#34474F;
  --sea:#0E7C86; --sea-ink:#0E7C86; --on-sea:#FFFFFF; --sea-tint:rgba(14,124,134,.10); --sea-track:#DCEBEC;
  --inv:#10242B; --inv-ink:#FFFFFF; --inv-ink-2:#CAD7DC; --inv-line:rgba(255,255,255,.75); --inv-btn:#FFFFFF; --inv-btn-ink:#10242B;
  --head-ink:#10242B; --head-sub:#34474F;
  --btn-sh:0 2px 10px rgba(28,70,86,.12);
  --f1:#FFD9C7; --f2:#BFE3F5; --f3:#C9EEDD; --f-ink:#10242B;
  --warn-bg:#FFF1BF; --warn-ink:#10242B;
  --f-body:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --gutter:16px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1722;
  --m1:22,60,108; --m2:12,100,106; --m3:42,52,124; --m4:10,82,90;
  --glass:rgba(20,28,36,.55); --glass-fb:rgba(20,28,36,.9); --nav-glass:rgba(20,28,36,.74);
  --glass-line:rgba(255,255,255,.14);
  --glass-sh:0 10px 28px rgba(0,0,0,.35);
  --solid:#121B23;
  --card:#1A2630; --card-line:rgba(255,255,255,.06);
  --ink:#EAF1F4; --ink-2:#B9C7CD; --ink-3:#9DAEB5;
  --line:#33434E; --chip:#24323C; --chip-ink:#CFDBE0;
  --sea:#0E7C86; --sea-ink:#6CCFD7; --on-sea:#FFFFFF; --sea-tint:rgba(108,207,215,.13); --sea-track:#24323C;
  --inv:#EAF2F4; --inv-ink:#10242B; --inv-ink-2:#34474F; --inv-line:rgba(16,36,43,.75); --inv-btn:#10242B; --inv-btn-ink:#FFFFFF;
  --head-ink:#F1F6F8; --head-sub:#C3D0D6;
  --btn-sh:0 2px 10px rgba(0,0,0,.35);
}

/* ---------- 바탕 ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(95% 60% at 0% 0%, rgba(var(--m1),1) 0%, rgba(var(--m1),0) 78%),
    radial-gradient(90% 55% at 100% 28%, rgba(var(--m2),1) 0%, rgba(var(--m2),0) 78%),
    radial-gradient(100% 60% at 0% 68%, rgba(var(--m3),1) 0%, rgba(var(--m3),0) 78%),
    radial-gradient(95% 60% at 100% 100%, rgba(var(--m4),1) 0%, rgba(var(--m4),0) 78%),
    var(--bg)}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
b,strong{font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea-ink);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gutter) calc(112px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* ---------- 위 줄 (메시 위, 유리 아님) ---------- */
.top{padding:2px 2px 0}
.top__row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{display:inline-flex;align-items:center;min-height:36px;padding:4px 14px;border-radius:999px;background:var(--card);color:var(--ink);font-size:0.9375rem;font-weight:800;letter-spacing:-.01em;box-shadow:var(--btn-sh);white-space:nowrap;font-variant-numeric:tabular-nums}
.top__btns{display:flex;gap:8px;flex-shrink:0}
.ibtn{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.375rem;line-height:1;border:0;padding:0;background:var(--card);color:var(--ink);box-shadow:var(--btn-sh);cursor:pointer}
.ibtn--sos{background:var(--inv)}
.ticker{display:flex;align-items:flex-start;gap:10px;width:100%;margin-top:12px;padding:11px 14px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--btn-sh);text-align:left;font-size:0.9375rem;line-height:1.45;cursor:pointer}
.ticker .dot{margin-top:7px}
.ticker b{color:var(--sea-ink);font-weight:800}
.tk-sub{display:block;color:var(--ink-2);font-size:0.875rem}
body[data-view="plan"] .ticker{display:none}

/* ---------- 화면 제목 ---------- */
.view{padding-top:18px}
.vhead{padding:0 2px 18px}
.title{font-size:2.125rem;line-height:1.12;font-weight:800;letter-spacing:-.03em;color:var(--head-ink);text-wrap:balance}
h2.title{font-size:1.875rem}
.title em,.em{font-style:normal;color:var(--sea-ink)}
.sub{margin-top:6px;font-size:1rem;font-weight:600;color:var(--head-sub);line-height:1.45}
.sub b{color:var(--head-ink)}

/* ---------- 벤토 + 유리 타일 ---------- */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.tile{min-width:0;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:24px;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);
  border:2px solid var(--glass-line);box-shadow:var(--glass-sh)}
.span2{grid-column:1 / -1}
.th{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:3px 12px 3px 11px;border-radius:999px;background:var(--card);color:var(--ink);font-size:0.875rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--card-line);font-variant-numeric:tabular-nums}
.pill--btn{border:0;min-height:36px;cursor:pointer;color:var(--sea-ink)}
.pill--ex{box-shadow:inset 0 0 0 2px var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.dot.live{background:var(--sea);box-shadow:0 0 0 4px var(--sea-tint)}
.card{min-width:0;background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px var(--card-line)}
.half .card{display:flex;flex-direction:column;padding:12px 11px}
.half .card:last-child{flex:1 1 auto}
.push{margin-top:auto}
.card h3{font-size:1.1875rem;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.k{font-size:0.875rem;font-weight:600;color:var(--ink-2);line-height:1.45}
.big{font-size:1.625rem;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:0.875rem}
ul.dots{list-style:none;margin:8px 0 0;padding:0}
ul.dots li{position:relative;padding-left:14px}
ul.dots li+li{margin-top:5px}
ul.dots li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.note{margin-top:10px;padding:9px 11px;border-radius:12px;background:var(--chip);font-size:0.9375rem;line-height:1.5}

/* 확인 필요 — 연노랑 + 점선 먹색 테두리 (의미 색, 두 테마 같음) */
.qbadge{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 8px 0 3px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);border:1.5px dashed var(--warn-ink);font-size:0.8125rem;font-weight:800;line-height:1.4;vertical-align:1px;white-space:nowrap}
.qbadge::before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--warn-ink);color:var(--warn-bg);font-size:0.75rem;font-weight:900;line-height:1}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 14px;border-radius:14px;border:0;font-size:1rem;font-weight:800;line-height:1.25;text-align:center;text-decoration:none;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn--pri{background:var(--sea);color:var(--on-sea)}
.btn--sec{background:var(--chip);color:var(--ink)}
.btn--sm{min-height:44px;padding:8px 12px;font-size:0.9375rem;border-radius:12px}
.btn--full{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn--pri{flex:1.6 1 0;min-height:54px;font-size:1.0625rem}
.acts .btn--sec{flex:1 1 0;min-height:54px}
.acts--sm{margin-top:10px}
.acts--sm .btn--pri,.acts--sm .btn--sec{min-height:44px;font-size:0.9375rem}
.maplinks{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin-top:2px;font-size:0.875rem;color:var(--ink-2)}
.maplinks a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.maplinks a:first-child{padding-left:2px}

/* 태그 */
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tag{display:inline-flex;align-items:center;min-height:26px;padding:1px 10px;border-radius:999px;font-size:0.875rem;font-weight:800;line-height:1.3;white-space:nowrap}
.tag.now{background:var(--sea);color:var(--on-sea)}
.tag.next{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.time{font-size:1.0625rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.eta{font-size:0.875rem;font-weight:700;color:var(--ink-2)}
.cat{display:inline-block;padding:0 7px;margin-right:6px;border-radius:7px;background:var(--chip);color:var(--chip-ink);font-size:0.8125rem;font-weight:700;line-height:1.6;vertical-align:1px;white-space:nowrap}
.meta .cat{margin-right:0}

/* ---------- 지금 / 다음 ---------- */
.now-title{margin-top:10px;font-size:1.6875rem;line-height:1.22;font-weight:800;letter-spacing:-.03em}
.pts{list-style:none;margin:10px 0 0;padding:0}
.pts li{position:relative;padding-left:14px;margin-top:6px}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.next h3{margin-top:8px;font-size:1.3125rem}
.next .k{margin-top:2px}
.alt{margin-top:10px;padding:9px 11px;border-radius:12px;background:var(--chip);font-size:0.9375rem;line-height:1.5}
.alt b{color:var(--sea-ink)}

/* ---------- 일정 타임라인 ---------- */
.days{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--chip)}
.days button{min-height:52px;border:0;border-radius:11px;background:none;color:var(--ink-2);cursor:pointer;line-height:1.2;padding:6px}
.days button b{display:block;font-size:1rem;color:inherit;font-variant-numeric:tabular-nums}
.days button small{display:block;font-size:0.8125rem;font-weight:600;margin-top:2px}
.days button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--btn-sh)}
.days button[aria-pressed="true"] b{color:var(--sea-ink)}
.day-t{margin:12px 2px 6px}
.tl{list-style:none;margin:0;padding:0}
.card--tl{padding:12px 10px}
.ev{display:grid;grid-template-columns:54px 18px minmax(0,1fr);column-gap:6px;padding:9px 4px;border-radius:12px}
.tm{white-space:nowrap;font-size:0.9688rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.45;letter-spacing:-.01em}
.tm small{display:block;font-size:0.8125rem;font-weight:600;color:var(--ink-3);line-height:1.3}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:8px;top:-9px;bottom:-9px;width:2px;background:var(--line)}
.ev:first-child .rail::before{top:12px}
.ev:last-child .rail::before{bottom:auto;height:21px}
.rail i{position:absolute;left:2px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--ink-3)}
.is-past .rail i{background:var(--ink-3);box-shadow:none}
.is-past .rail i::after{content:"";position:absolute;left:5px;top:2.5px;width:3px;height:6px;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(45deg)}
.is-now .rail i{left:0;top:3px;width:18px;height:18px;background:var(--sea);box-shadow:0 0 0 4px var(--sea-tint)}
.ev__c{min-width:0}
.ev__h{position:relative;display:block;padding-right:26px;border-radius:8px}
.ev__h[role="button"]{cursor:pointer}
.ev-t{font-size:1rem;font-weight:700;line-height:1.45;letter-spacing:-.01em}
.ev-m{margin-top:2px;font-size:0.9375rem;color:var(--ink-2);line-height:1.5}
/* 접힌 상태에서는 첫 메모를 한 줄만 — 눌러 펼치면 전부 */
.ev:not(.is-open):not(.no-x) .ev-m{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chev{position:absolute;right:4px;top:6px;width:10px;height:10px;border:solid var(--ink-3);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}
.is-open .chev{transform:rotate(-135deg);top:11px}
.ev__x{display:none}
.is-open .ev__x{display:block}
.ev-ml{list-style:none;margin:4px 0 0;padding:0;font-size:0.9375rem;color:var(--ink-2);line-height:1.5}
.ev-ml li{position:relative;padding-left:12px;margin-top:4px}
.ev-ml li::before{content:"";position:absolute;left:1px;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.is-past .tm,.is-past .ev-t{color:var(--ink-3)}
.is-past .ev-t{font-weight:600}
.ev.is-now{background:var(--sea-tint)}
.ev.is-now .ev-t{font-size:1.0625rem;font-weight:800}
.ev .tag.now{min-height:22px;padding:0 8px;font-size:0.8125rem;vertical-align:2px}
.tmr p{font-size:1rem;line-height:1.55}
.tmr .lbl{font-weight:800}

/* ---------- 숙소 ---------- */
.addr{margin-top:6px;font-size:1rem;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{padding:9px 11px;border-radius:12px;background:var(--chip);min-width:0}
.stat b{display:block;font-size:1.0625rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.info{margin-top:10px;font-size:0.9375rem;color:var(--ink-2);font-weight:600}

/* ---------- 날씨 · 정산 (반쪽 타일) ---------- */
.wx-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.wx-ic{font-size:1.75rem;line-height:1}
.wx-d{font-size:1rem;font-weight:800}
.wx-t{margin-top:6px;line-height:1.2}
.wx-t .big{font-size:1.875rem}
.wx-lo{display:block;margin-top:2px;font-size:0.9375rem;font-weight:600;color:var(--ink-2)}
.wx-s{margin-top:8px}
.wx-mid{margin-top:4px;font-size:1.125rem;font-weight:800;letter-spacing:-.02em}
.lead{margin-top:4px;font-size:1.125rem;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.memo{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:0.9375rem;font-weight:700;line-height:1.45}
.fine{padding-top:10px;font-size:0.8125rem;color:var(--ink-3);font-weight:600}
.sum-big{margin-top:2px;font-size:1.1875rem}   /* 백만 원대(1,266,510원)가 360 폭 반쪽 타일에서 한 줄에 들어가는 크기 */
.xf{padding:9px 0 7px;border-top:1px solid var(--line)}
.xf:first-of-type{border-top:0;padding-top:4px}
.xf .who-l{font-size:0.875rem;font-weight:700;line-height:1.7}
.xf .amt{display:block;font-size:1.1875rem}
.fam{display:inline-block;padding:0 6px;border-radius:7px;background:var(--fc,var(--chip));color:var(--f-ink);font-weight:800;white-space:nowrap}
.half .btn{padding:10px 6px}
/* 반쪽 타일 카드 맨 아래 버튼·글: 앞에 늘어나는 간격(최소 12px)을 둬서 바닥에 붙인다 */
.sp{flex:1 0 12px}

/* ---------- 체크 ---------- */
.ck__bar{height:10px;border-radius:99px;background:var(--sea-track);overflow:hidden;margin:10px 0 4px}
.ck__bar i{display:block;height:100%;width:0;background:var(--sea);border-radius:99px;transition:width .2s}
.ck__sub{font-size:0.875rem;font-weight:600;color:var(--ink-2)}
.ck__note{margin-top:8px;padding:9px 11px;border-radius:12px;background:var(--chip);font-size:0.9375rem}
.ck__g h4{margin:12px 0 0;font-size:0.875rem;font-weight:800;color:var(--ink-2)}
.ck__i{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 2px;cursor:pointer;border-top:1px solid var(--line)}
.ck__g h4 + .ck__i,.ck__g .ck__i:first-child{border-top:0}
.ck__i input{position:absolute;opacity:0;width:1px;height:1px;margin:0;left:0;top:50%}
.ck__box{flex:none;position:relative;width:26px;height:26px;border-radius:8px;background:var(--card);box-shadow:inset 0 0 0 2px var(--ink-3)}
.ck__i input:checked + .ck__box{background:var(--sea);box-shadow:none}
.ck__i input:checked + .ck__box::after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;border:solid var(--on-sea);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck__i input:focus-visible + .ck__box{outline:3px solid var(--sea-ink);outline-offset:2px}
.ck__t{font-size:1rem;font-weight:600;line-height:1.45;min-width:0}
.ck__i input:checked ~ .ck__t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.ck__f{display:flex;justify-content:flex-end;margin-top:6px}
.more{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;width:100%;margin-top:8px;padding:0 14px;border:0;border-radius:12px;background:var(--chip);color:var(--ink);font-weight:800;text-decoration:none;cursor:pointer;text-align:left}
.more span{font-size:0.875rem;color:var(--ink-2);font-weight:600}
.alldone{padding:10px 2px;font-weight:700;color:var(--sea-ink)}

/* ---------- 비상 — 반전 카드(낮엔 먹색, 밤엔 흰색) ---------- */
#sos{scroll-margin-top:16px}
.sos .pill{background:var(--inv);color:var(--inv-ink)}
.sos .dot{background:var(--inv-ink)}
.card.inv{background:var(--inv);color:var(--inv-ink);padding:16px}
.inv h2{font-size:1.5625rem;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.b119{display:flex;width:100%;min-height:70px;margin-top:12px;border-radius:16px;background:var(--inv-btn);color:var(--inv-btn-ink);font-size:2.125rem;font-weight:800;letter-spacing:-.02em}
.b119 svg{width:28px;height:28px}
.hosp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hbtn{flex-direction:column;gap:1px;min-height:66px;padding:8px 6px;background:transparent;color:var(--inv-ink);box-shadow:inset 0 0 0 2px var(--inv-line)}
.hbtn b{font-size:0.9375rem;font-weight:800}
.hbtn span{font-size:0.875rem;font-weight:600;font-variant-numeric:tabular-nums}
.inv ul.dots{margin-top:12px}
.inv ul.dots li{font-size:1rem;line-height:1.5}
.inv ul.dots li+li{margin-top:8px}
.inv ul.dots li::before{background:var(--inv-ink-2)}
.inv .qbadge{border-color:var(--warn-ink)}
.lnks{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:6px}
.lnk{display:inline-flex;align-items:center;min-height:44px;font-size:1rem;font-weight:800;text-decoration:underline;text-underline-offset:3px}

.ver{margin-top:22px;text-align:center;font-size:0.8125rem;font-weight:600;color:var(--head-sub)}
/* ---------- 장소 ---------- */
.pl{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.pl__c h3{font-size:1.1875rem}
.pl__c h3 .tag{margin-left:6px;vertical-align:2px;background:var(--chip);color:var(--chip-ink);min-height:24px;font-size:0.8125rem}
.pl__c h3 .tag--b{box-shadow:inset 0 0 0 2px var(--ink);background:none;color:var(--ink)}
.pl__meta{margin-top:6px;display:grid;gap:3px;font-size:0.9375rem}
.pl__meta div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px}
.pl__note{margin-top:8px;font-size:0.9375rem;color:var(--ink-2)}
.facts{font-size:0.9375rem}
.qlist li{font-size:0.9375rem}
.foot{margin:22px 0 4px;font-size:0.8125rem;color:var(--head-sub);text-align:center;font-weight:600;line-height:1.6}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.names button,.chipsel button{min-height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);font-size:0.9375rem;font-weight:800;cursor:pointer}
.names button[aria-pressed="true"],.chipsel button[aria-pressed="true"]{background:var(--sea);color:var(--on-sea)}
.names button.done{opacity:.45}
.chipsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* ---------- 정산 ---------- */
.form{display:grid;gap:10px;margin-top:10px}
.field{width:100%;min-height:52px;padding:0 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:1rem}
.field:focus{border-color:var(--sea);outline:none}
.famsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.famsel button{min-height:48px;border-radius:14px;border:0;background:var(--chip);color:var(--ink);font-size:1rem;font-weight:800;cursor:pointer}
.famsel button[aria-pressed="true"]{background:var(--fc);color:var(--f-ink);box-shadow:inset 0 0 0 2px var(--f-ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{min-height:40px;padding:0 12px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);font-size:0.875rem;font-weight:700;cursor:pointer}
.ledger{list-style:none;margin:6px 0 0;padding:0}
.ledger li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;min-height:52px;padding:6px 0;border-top:1px solid var(--line);font-size:1rem}
.ledger li:first-child{border-top:0}
.amt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.del{width:40px;height:40px;border-radius:12px;border:0;background:var(--chip);color:var(--ink-2);cursor:pointer;font-weight:800}
.empty{color:var(--ink-2);font-size:0.9375rem;padding:6px 0}
.sum{display:grid;gap:6px;margin-top:8px;font-size:1rem}
.sum .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sum .row b{font-variant-numeric:tabular-nums}
.lnote{grid-column:1/-1;display:block;margin:-2px 0 4px;font-size:0.8125rem;font-weight:600;color:var(--ink-2);line-height:1.45}
.amt.wait{font-size:0.875rem;color:var(--ink-2)}
/* ---------- 아래 고정 메뉴 (유리) ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock__in{pointer-events:auto;max-width:536px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:24px;background:var(--nav-glass);
  -webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);
  border:2px solid var(--glass-line);box-shadow:0 8px 30px rgba(16,36,43,.18)}
.dock button{position:relative;flex:1 1 0;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:18px;background:none;color:var(--ink-2);font-size:0.8125rem;font-weight:700;line-height:1.2;cursor:pointer}
.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"]{background:var(--card);color:var(--sea-ink);font-weight:800}
.dock__n{position:absolute;top:3px;left:50%;margin-left:6px;min-width:24px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:var(--card);font-size:0.8125rem;font-weight:800;line-height:20px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;max-width:calc(100% - 32px);padding:11px 18px;border-radius:14px;background:var(--inv);color:var(--inv-ink);font-size:0.9375rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 접근성 · 대체 ---------- */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .tile{background:var(--glass-fb)}
  .dock__in{background:var(--solid)}
}
@media (prefers-reduced-transparency: reduce){
  .tile,.dock__in{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  .card,.pill{box-shadow:inset 0 0 0 1px var(--line)}
  .card.inv{box-shadow:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:339px){.bento{grid-template-columns:minmax(0,1fr)}}
@media (min-width:600px){.title{font-size:2.375rem}}
@media print{.top,.dock,.toast,.acts,.maplinks{display:none!important}.wrap{padding-bottom:0}}

/* ================= 다낭·호이안에서 새로 붙인 것 ================= */
/* 큰 글씨 보기: 글자 크기는 전부 rem — 뿌리 크기만 키운다 (배치 px 는 그대로라 가로로 안 넘친다) */
html{font-size:100%}
html[data-big]{font-size:120%}
.vn{font-weight:700;letter-spacing:0;word-break:normal;overflow-wrap:anywhere}
.ibtn--txt{font-size:1.1875rem;font-weight:800;letter-spacing:-.04em}
html[data-big] .ibtn--txt{background:var(--sea);color:var(--on-sea)}

/* 날짜 7칸 */
.days{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.days button{min-height:56px;padding:5px 0}
.days button small{margin-top:0;font-size:0.8125rem}
.days button b{font-size:1.125rem}
.days button.is-today b::after{content:"";display:block;width:5px;height:5px;margin:2px auto 0;border-radius:50%;background:var(--sea)}
.tm .kst{color:var(--sea-ink);font-weight:800}

/* 두 시계 · 날씨 (반쪽) */
.clk{display:grid;gap:8px}
.clk__r{min-width:0}
.clk__r b{display:block;font-size:1.875rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.clk__r--kr b{font-size:1.5rem;color:var(--sea-ink)}
.clk__r + .clk__r{padding-top:8px;border-top:1px solid var(--line)}

/* 예보 → 카드 추천 */
.fc-head{font-size:1.1875rem;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.fc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.fc div{min-width:0;padding:8px 4px;border-radius:12px;background:var(--chip);text-align:center}
.fc div.wet{background:var(--sea-tint);box-shadow:inset 0 0 0 2px var(--sea)}
.fc div.mid{box-shadow:inset 0 0 0 2px var(--line)}
.fc span{display:block;font-size:0.8125rem;font-weight:700;color:var(--ink-2)}
.fc i{display:block;font-style:normal;font-size:1.375rem;line-height:1.3}
.fc b{display:block;font-size:0.9375rem;font-variant-numeric:tabular-nums}
.fc-day{margin-top:12px;font-size:0.875rem;font-weight:800;color:var(--ink-2)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--chip)}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;border-radius:11px;background:none;color:var(--ink-2);font-size:0.9375rem;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--sea-ink);box-shadow:var(--btn-sh)}

/* 날씨 카드 */
.wc h3{font-size:1.1875rem}
.wc.is-rec{box-shadow:inset 0 0 0 2px var(--sea)}
.wc__go{margin-top:4px;font-size:0.9375rem;font-weight:700}
.wc .tag{margin-left:6px;vertical-align:2px;background:var(--sea);color:var(--on-sea);min-height:24px;font-size:0.8125rem}
.wc .tag--c{background:var(--warn-bg);color:var(--warn-ink)}
.sprow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.sprow b{display:block;font-size:1rem;line-height:1.35}
.sprow span{display:block;font-size:0.875rem;color:var(--ink-2);font-weight:600}
.sprow__b{display:flex;gap:6px}
.mini{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 10px;border:0;border-radius:12px;background:var(--chip);color:var(--ink);font-size:0.875rem;font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap}
.mini--pri{background:var(--sea);color:var(--on-sea)}
.sps{margin-top:8px}
.grp-h{margin:14px 0 2px;font-size:0.875rem;font-weight:800;color:var(--ink-2)}
.dlv{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.grp-h + .dlv,.note + .dlv{border-top:0}
.dlv__t b{font-size:1rem;margin-right:6px}
.dlv__t .cat{margin-right:0}
.dlv__m,.dlv__b{display:block;font-size:0.875rem;color:var(--ink-2);font-weight:600;line-height:1.45}
.dlv__b{color:var(--ink)}

/* 오늘 계획 */
.plan-now{font-size:1.3125rem;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.plan-by{margin-top:4px}
.field--sm{min-height:48px}
.lbl{display:block;margin:10px 0 4px;font-size:0.875rem;font-weight:800;color:var(--ink-2)}

/* 나들이 고르기 (10/27) — 날짜 7칸 · 아기 컨디션 · 칸마다 후보(날씨 맞는 것이 위) · 고르면 칸에 들어가고 다른 날 목록에서 빠짐 */
.pkd button i{display:block;font-style:normal;font-size:0.75rem;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.2}
.pkd button.is-today small{color:var(--lan-txt);font-weight:800}
.pk-c .lbl{margin-top:12px}
.pk-day{margin-top:14px;font-size:1rem;line-height:1.45}
.pk-day b{font-family:var(--f-game);font-weight:400;color:var(--sea-ink)}
.pk .k{margin-top:2px}
.slot{margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
.slot__h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.slot__h b{font-family:var(--f-game);font-weight:400;font-size:1.25rem;line-height:1.2}
.slot__h span{font-size:0.875rem;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wxc{margin-left:auto;padding:1px 9px;border-radius:999px;background:var(--chip);font-style:normal;font-size:0.8125rem;font-weight:800;white-space:nowrap}
.wxc--wet{background:var(--sea-tint);color:var(--sea-ink)}
.slot__hint{margin-top:4px}
.cands{margin-top:6px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.cand:first-child{border-top:0}
.cand__t{display:block;min-width:0;min-height:44px;padding:4px 0 4px 10px;border:0;border-left:3px solid transparent;background:none;text-align:left;cursor:pointer;line-height:1.35}
.cand.is-rec .cand__t{border-left-color:var(--sea)}
.cand__t b{display:block;font-size:1rem;font-weight:800}
.cand__t small{display:block;margin-top:1px;font-size:0.8125rem;font-weight:600;color:var(--ink-2)}
.cand__g{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cand__x{grid-column:1 / -1;margin:2px 0 6px 13px;padding:10px 12px;border-radius:12px;background:var(--chip)}
.cand__x .sprow{border-top-color:var(--line)}
.cand .tag,.wc h3 .tag{min-height:22px;padding:0 8px;font-size:0.75rem;font-family:var(--f-body);font-weight:800;background:var(--chip);color:var(--chip-ink)}
.wc h3 .tag{margin-left:6px}
.cand .tag.tag--rec{background:var(--sea);color:var(--on-sea)}
.cand .tag.tag--bad{background:none;box-shadow:inset 0 0 0 1.5px var(--ink-3);color:var(--ink-2)}
.cand .tag.tag--c,.wc h3 .tag.tag--c{background:var(--warn-bg);color:var(--warn-ink)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin-top:8px;padding:10px 10px 10px 12px;border-radius:14px;background:var(--sea-tint);box-shadow:inset 0 0 0 2px var(--sea)}
.pick__t b{display:block;font-size:1.0625rem;font-weight:800;line-height:1.35}
.pick__t small{display:block;margin-top:2px;font-size:0.8125rem;font-weight:600;color:var(--ink-2)}
.lob{margin-top:16px;padding-top:12px;border-top:2px solid var(--line)}
.pmeta{margin-top:4px;font-size:0.875rem;font-weight:700;color:var(--ink-2)}
.wc.is-used{opacity:.72}
.used{margin-top:12px;font-weight:800;color:var(--sea-ink)}
.pool-h{margin:6px 6px 0;font-size:0.875rem;font-weight:800;color:var(--ink-2)}
.olk th{padding:4px;text-align:left;font-size:0.8125rem;font-weight:800;color:var(--ink-2)}
.olk th:last-child{text-align:right}
.olk th small{display:block;font-weight:600;font-size:0.75rem}
.olk td:last-child{font-variant-numeric:tabular-nums}
.chipsel button{display:inline-flex;align-items:center}

/* 장소 */
.pl__c .vn{margin-top:2px;font-size:0.9375rem;color:var(--ink-2)}
.pl__rate{font-weight:800;font-variant-numeric:tabular-nums}
.acts--3 .btn{flex:1 1 0;min-height:48px;padding:8px 6px;font-size:0.9375rem}
.filt{display:grid;gap:8px}

/* 지도 */
#mapBox{position:relative;height:50vh;height:50dvh;min-height:320px;border-radius:16px;overflow:hidden;background:var(--chip)}
#map{position:absolute!important;top:0;right:0;bottom:0;left:0}
.map-msg{position:absolute;left:12px;right:12px;top:12px;z-index:3;padding:10px 12px;border-radius:12px;background:var(--card);box-shadow:var(--btn-sh);font-size:0.9375rem;font-weight:700;text-align:center}
.mk{width:30px;height:30px;padding:0;border:2px solid #FFFFFF;border-radius:50%;background:#10242B;color:#FFFFFF;font-size:0.9375rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.mk--stay{width:38px;height:38px;background:#0E7C86;font-size:1.1875rem;z-index:2}
.mk--food{background:#C2562B}.mk--cafe{background:#8A5A2B}.mk--sight{background:#2C6DB5}.mk--spa{background:#8C4FA8}.mk--kids{background:#B8457A}.mk--med{background:#C0392B}.mk--mart{background:#2F8A4E}.mk--transit{background:#555F66}.mk--atm{background:#9A6B00}
.mk.is-sel{outline:3px solid #FFD23F;outline-offset:1px;z-index:3}
.pmk{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 2px;border-radius:999px;background:#FFFFFF;color:#10242B;font-size:0.8125rem;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap}
.pmk i{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--fc,#BFE3F5);font-style:normal}
.pmk.is-stale{opacity:.6}
.memk{width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #FFFFFF;box-shadow:0 0 0 6px rgba(26,115,232,.25)}

/* 기사에게 보여주기 — 화면 가득, 흰 바탕 검은 글씨 (두 테마 같음) */
.show{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:flex;flex-direction:column;background:#FFFFFF;color:#000000;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
.show__x{align-self:flex-end;min-height:48px;padding:0 18px;border:2px solid #000000;border-radius:999px;background:#FFFFFF;color:#000000;font-size:1rem;font-weight:800;cursor:pointer}
.show__ko{margin-top:6px;font-size:0.9375rem;font-weight:700;color:#444444}
.show__lead{margin-top:14px;font-size:1.5rem;font-weight:700;line-height:1.3;word-break:normal}
.show__name{margin-top:12px;font-size:2.75rem;font-weight:900;line-height:1.14;letter-spacing:-.01em;word-break:normal;overflow-wrap:anywhere}
.show__addr{margin-top:16px;font-size:2.125rem;font-weight:800;line-height:1.2;word-break:normal;overflow-wrap:anywhere}
.show__tel{margin-top:auto;padding-top:18px;font-size:1.125rem;font-weight:700}
.show--txt .show__name{font-size:3rem}

/* 표현 */
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ph:first-child{border-top:0}
.ph b{display:block;font-size:1rem}
.ph .vn{display:block;font-size:1.125rem;color:var(--sea-ink)}

/* 기록 */
.cur{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.cur .seg{min-width:112px}
.conv{font-size:0.9375rem;font-weight:700;color:var(--ink-2);min-height:1.5em}
.ledger .cat{margin-right:0}
.ledger li small{display:block;font-size:0.8125rem;font-weight:600;color:var(--ink-2)}
.ledger li{grid-template-columns:auto minmax(0,1fr) auto auto}
.lg-day{margin:12px 0 0;font-size:0.875rem;font-weight:800;color:var(--ink-2)}
.dose{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--sea-tint);font-size:1rem;font-weight:700;line-height:1.5}
.dose.warn{background:var(--warn-bg);color:var(--warn-ink)}
.dose b{font-variant-numeric:tabular-nums}
.hot{color:#C0392B}
:root[data-theme="dark"] .hot{color:#FF8A7A}
textarea.field{min-height:110px;padding:12px 14px;line-height:1.5;resize:vertical}
.mf{display:grid;gap:4px;margin-top:10px}
.mf label{font-size:0.875rem;font-weight:800;color:var(--ink-2)}

/* 공략집 아코디언 */
details.card{padding:0}
details.card > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;padding:10px 14px;font-size:1.0625rem;font-weight:800;cursor:pointer}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:"";flex:none;width:10px;height:10px;margin-right:4px;border:solid var(--ink-3);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}
details.card[open] > summary::after{transform:rotate(-135deg)}
.dbody{padding:0 14px 14px;font-size:1rem}
.dbody ul.dots{margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:0.9375rem}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td:first-child{font-weight:700}
.tbl td:last-child{text-align:right;white-space:nowrap;font-weight:800;color:var(--sea-ink)}
.code{margin-top:8px;padding:10px;border-radius:12px;background:var(--chip);font-size:1.375rem;font-weight:800;letter-spacing:.08em;text-align:center;font-variant-numeric:tabular-nums;-webkit-user-select:all;user-select:all}
.peer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.peer:first-child{border-top:0}
.peer i{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--fc,var(--chip));color:var(--f-ink);font-style:normal;font-weight:800}
.peer small{display:block;font-size:0.875rem;color:var(--ink-2);font-weight:600}
/* 오늘 탭 가족 위치 한 줄 — 사람을 누르면 지도에서 그 위치로(data-peer) */
.fam__in{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 4px}
.fam__h{margin-right:2px;font-size:0.875rem;font-weight:800;color:var(--ink-2)}
.fam__p{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;min-height:40px;padding:4px 12px 4px 4px;border:0;border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:0.875rem;cursor:pointer;box-shadow:inset 0 0 0 1px var(--card-line)}
.fam__p i{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--fc,var(--chip));color:var(--f-ink);font-style:normal;font-weight:800}
.fam__p b{white-space:nowrap}
.fam__p small{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-size:0.8125rem;font-weight:600}
.fam__p.is-stale{opacity:.55}
.fam__me{min-height:40px;padding:4px 12px;border:0;border-radius:999px;background:var(--sea-tint);color:var(--sea-ink);font:inherit;font-size:0.875rem;font-weight:800;cursor:pointer}
.hbtn--pri{background:var(--inv-btn);color:var(--inv-btn-ink);box-shadow:none}
.hbtn span{white-space:nowrap;font-size:0.8125rem}
html[data-big] .hosp{grid-template-columns:minmax(0,1fr)}
html[data-big] .ev{grid-template-columns:68px 18px minmax(0,1fr)}
.b119{font-size:1.875rem}
.sos-h{margin-top:14px;font-size:0.9375rem;font-weight:800;color:var(--inv-ink-2)}
.inv .lnk{color:var(--inv-ink)}
.half .big{font-size:1.5rem}
@media (max-width:374px){.show__name{font-size:2.375rem}.show__addr{font-size:1.8125rem}.clk__r b{font-size:1.6875rem}}

/* ================= 디자인 D (10/14): 강화 틀 + 도쿄 맛 + 경로 ================= */
/* 제목·숫자만 둥근 글꼴 Jua (fonts/Jua-ko.woff2 — 한글 2,350자 + 페이지 글자만 남긴 것, tools/make_font.py · SIL OFL 1.1) */
@font-face{font-family:'Jua';src:url('fonts/Jua-ko.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
:root{--lan:#F5B83D;--lan-d:#C98A12;--lan-txt:#9A6408;--lan-ink:#2B1D00;--f-game:'Jua',var(--f-body)}
.title,.now-title,.card h3,.badge,.time,.tm,.big,.clk__r b,.fc-head,.plan-now,.lead,.wx-d,.days button b,.chap b,.stage,.app,.appi__t b,.rb,.rr-t{font-family:var(--f-game);font-weight:400;letter-spacing:0}
.title{font-size:2.25rem}
.now-title{font-size:1.75rem}
.card h3{font-size:1.25rem}
.title em{color:var(--lan-txt)}
:root[data-theme="dark"] .title em{color:var(--lan)}

/* 오늘 탭 머리: DAY 표시 · 등불 그림 */
#v-plan .vhead{position:relative}
#v-plan .title{padding-right:62px}
.stage{display:inline-block;margin-bottom:6px;padding:2px 10px;border-radius:8px;background:var(--inv);color:var(--inv-ink);font-size:.875rem;letter-spacing:.02em}
.lantern{position:absolute;right:4px;top:-6px;width:58px;height:86px;pointer-events:none}

/* 날짜 칩 줄 (오늘 탭 위) — 아이콘은 예보, 없으면 그날 성격 · 누르면 그날 일정 */
.chap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
body:not([data-view="plan"]) .top .chap{display:none}
.chap button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 6px;border:0;border-radius:14px;background:var(--card);box-shadow:0 3px 0 rgba(16,36,43,.12);font-size:.75rem;font-weight:700;line-height:1.25;color:var(--ink-2);cursor:pointer}
.chap button i{font-style:normal;font-size:1.0625rem;line-height:1.2}
.chap button b{font-size:.9375rem;color:var(--ink)}
.chap button.on{background:var(--lan);color:var(--lan-ink);box-shadow:0 3px 0 var(--lan-d)}
.chap button.on b{color:var(--lan-ink)}
.chap button.past{opacity:.55}
.chap button:active{transform:translateY(2px);box-shadow:none}

/* 앱 바로가기 줄 — 도톰한 버튼 (가로로 밀어요) */
.approw{display:flex;gap:8px;overflow-x:auto;margin:-6px calc(-1 * var(--gutter)) 16px;padding:2px var(--gutter) 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.approw::-webkit-scrollbar{display:none}
.app{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px 0 10px;border-radius:14px;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 rgba(16,36,43,.14);font-size:1rem;text-decoration:none;white-space:nowrap}
.app i{font-style:normal;font-size:1.375rem;line-height:1}
.appi{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.appi:first-child{border-top:0}
.appi > i{flex:none;width:30px;font-style:normal;font-size:1.5rem;text-align:center}
.appi__t{flex:1;min-width:0;display:grid;gap:1px}
.appi__t b{font-size:1.0625rem}
.appi__t small{font-size:.875rem;color:var(--ink-2);line-height:1.45}
.appi__x{flex:none;color:var(--ink-3);font-weight:800}

/* 버튼·태그 — 아래 그림자(눌리는 느낌), 지금 = 등불 색 */
.btn{box-shadow:0 3px 0 rgba(16,36,43,.18)}
.btn--pri{box-shadow:0 3px 0 #08555C}
.btn:active{transform:translateY(2px);box-shadow:none}
.tag.now{background:var(--lan);color:var(--lan-ink);font-family:var(--f-game);font-weight:400}
.ev.is-now{background:rgba(245,184,61,.16)}
.is-now .rail i{background:var(--lan);box-shadow:0 0 0 4px rgba(245,184,61,.25)}

/* 오늘 경로 그림 카드 — 실제 좌표 + OSM 해안선·강 위에 점선 */
:root{--rm-land:#EEF2E1;--rm-sea:#A9D8EF;--rm-ink:#1E2A30;--rm-halo:#FFFFFF}
:root[data-theme="dark"]{--rm-land:#26323A;--rm-sea:#123A52;--rm-ink:#EAF1F4;--rm-halo:#0E171D}
.rcard{padding:12px}
.rmap{display:block;width:100%;height:auto;margin-top:8px;border-radius:14px;overflow:hidden}
.rm-land{fill:var(--rm-land)}
.rm-sea{fill:var(--rm-sea)}
.rm-river{fill:none;stroke:var(--rm-sea);stroke-linecap:round;stroke-linejoin:round}
.rm-route-c{fill:none;stroke:var(--rm-halo);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.rm-route{fill:none;stroke:#E2483B;stroke-width:3;stroke-dasharray:1 7;stroke-linecap:round;stroke-linejoin:round}
.rm-stop circle,.rm-stop rect{fill:#FFFFFF;stroke:#1E2A30;stroke-width:2.5}
.rm-stop.is-stay circle{fill:var(--lan)}
.rm-n{font-family:var(--f-game);font-size:13px;text-anchor:middle;fill:#1E2A30}
.rm-l{font-family:var(--f-game);font-size:14px;fill:var(--rm-ink);paint-order:stroke;stroke:var(--rm-halo);stroke-width:4px;stroke-linejoin:round}
.rm-far path{fill:#E2483B;stroke:var(--rm-halo);stroke-width:1.5}
.rm-far rect{fill:var(--rm-ink)}
.rm-far text{font-family:var(--f-game);font-size:13px;fill:var(--rm-halo)}
.rm-scale path{stroke:var(--rm-ink);stroke-width:2.5;fill:none}
.rm-scale text{font-size:11px;font-weight:700;fill:var(--rm-ink);paint-order:stroke;stroke:var(--rm-halo);stroke-width:3px}
.rrows{list-style:none;margin:10px 0 0;padding:0}
.rr{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.rr:first-child{border-top:0}
.rr-t{font-size:.9375rem;line-height:24px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rr-c{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;font-size:.9375rem;font-weight:700;line-height:1.35}
.rr-c > span{display:inline-flex;align-items:center;gap:5px}
.rr--mv .rr-c{font-weight:800}
.rb{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--ink);color:var(--card);font-size:.8125rem;line-height:1}
.rb.is-stay{background:var(--lan);color:var(--lan-ink)}
.rb.is-far{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.rl{font-style:normal;font-size:.8125rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
.rl::before{content:"→ ";color:var(--ink-3)}
.rl::after{content:" →";color:var(--ink-3)}

/* 지도 탭: 날짜 칩 · 경로 안내 · 번호 핀 */
.rchips{margin:0}
.rchips button{padding:4px 0 5px}
.rnote{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;border-radius:12px;background:var(--card);font-size:.875rem;font-weight:700;line-height:1.45}
.rnote span{flex:1 1 100%;min-width:0}
.rnote small{display:block;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.rnote .mini{min-height:40px}
.rpin{width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer}
.rpin b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:#FFFFFF;border:3px solid #1E2A30;color:#1E2A30;font-family:var(--f-game);font-weight:400;font-size:15px;line-height:1;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.rpin.is-stay b{background:#F5B83D}
.rpin.is-far b{background:#EDF2F4}
.rpin span{position:absolute;top:50%;left:calc(50% + var(--o,18px));transform:translateY(-50%);padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.94);color:#1E2A30;font-family:var(--f-game);font-size:14px;line-height:1.45;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);pointer-events:none}
.rpin.lbl-l span{left:auto;right:calc(50% + var(--o,18px))}
.rpin.lbl-b span{left:50%;top:calc(50% + 18px);transform:translateX(-50%)}
.rpin.lbl-t span{left:50%;top:auto;bottom:calc(50% + 18px);transform:translateX(-50%)}
#mapBox.routing .mk{opacity:.35!important}   /* 마커는 maplibre 가 opacity 를 직접 적어 넣어요 */
#mapBox.routing .mk.is-sel{opacity:1!important}

/* ---------- 시설 특성 뱃지 & SOS 시트 & 액션 바 ---------- */
.pl__badges{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px}
.tag--ac{background:#E0F2FE;color:#0369A1}
.tag--baby{background:#FEF3C7;color:#B45309}
.tag--room{background:#EDE9FE;color:#6D28D9}
.tag--kids{background:#FCE7F3;color:#BE185D}

.sos-sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:900;display:flex;flex-direction:column;justify-content:flex-end}
.sos-sheet[hidden]{display:none!important}
.sos-sheet__backdrop{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.sos-sheet__panel{position:relative;background:var(--solid);border-radius:24px 24px 0 0;padding:20px 20px 32px;box-shadow:0 -8px 32px rgba(0,0,0,.28);max-height:85vh;overflow-y:auto;z-index:1}
.sos-sheet__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sos-sheet__head h3{font-size:1.1875rem;font-weight:800;color:var(--head-ink);margin:0}
.sos-sheet__x{background:none;border:none;font-size:1.25rem;font-weight:700;color:var(--ink-3);padding:4px 8px;cursor:pointer}
.sos-sheet__hero button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px;border-radius:14px;width:100%}
.sos-sheet__hero b{font-size:1.0625rem}
.sos-sheet__hero span{font-size:.8125rem;opacity:.9}
.sos-sheet__label{font-size:.8125rem;font-weight:700;color:var(--ink-3);margin:14px 0 6px}
.sos-sheet__calls{display:grid;gap:6px}
.sos-call{display:flex;align-items:center;justify-content:space-between;background:var(--chip);padding:10px 14px;border-radius:12px;text-decoration:none;color:var(--chip-ink);font-size:.875rem}
.sos-call__name{font-weight:600}
.sos-call__tel{font-weight:700;color:var(--sea-ink)}
.sos-sheet__links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sos-sheet__links button{font-size:.8125rem;padding:9px 6px}
.show__actions{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
/* 누구세요? — 처음 열 때 · 맨 위 이름 버튼 · 합류 전 사람에게 붙는 날짜 메모 */
.who{position:fixed;top:0;right:0;bottom:0;left:0;z-index:85;display:flex;padding:calc(16px + env(safe-area-inset-top,0px)) var(--gutter) calc(16px + env(safe-area-inset-bottom,0px));background:rgba(10,23,34,.5);overflow-y:auto}
.who__c{width:100%;max-width:440px;margin:auto;background:var(--card);color:var(--ink);border-radius:20px;padding:20px 16px 16px;box-shadow:var(--glass-sh)}
.who__k{font-size:0.875rem;font-weight:800;color:var(--sea-ink)}
.who__t{margin-top:4px;font-size:1.625rem;font-weight:900;letter-spacing:-.01em}
.who__s{margin-top:6px;font-size:0.9375rem;line-height:1.5;color:var(--ink-2)}
.who__g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.who__g .btn{flex-direction:column;gap:2px;min-height:60px;font-size:1.0625rem}
.who__g .btn small{font-size:0.75rem;font-weight:700;opacity:.85}
.who__g .btn:last-child:nth-child(odd){grid-column:1 / -1}
.who__f{margin-top:12px;font-size:0.8125rem;color:var(--ink-3);text-align:center}
.who .more{margin-top:10px}
.whoBtn{display:inline-flex;align-items:center;gap:4px;min-height:32px;margin-top:6px;padding:2px 10px;border:0;border-radius:999px;background:var(--chip);color:var(--chip-ink);font:inherit;font-size:0.875rem;font-weight:800;vertical-align:middle;cursor:pointer}
.who__simple{width:100%;margin-top:12px}
/* 간단히 보기(할아버지·할머니 기본) — 오늘(지금·다음·남은 일정·숙소·급할 때) · 일정 · 도움(비상·베트남어·챙길 것·메모)만 */
[data-simple] .nosimple,[data-simple] #routeTile,[data-simple] #expTile,[data-simple] #fevTile,[data-simple] .tlf,
[data-simple] #expSec,[data-simple] #fevSec,[data-simple] #dock [data-view="map"],[data-simple] [data-psheet]{display:none!important}
.onlysimple{display:none}
[data-simple] .onlysimple{display:inline}
.whoN{display:block;margin-top:4px;font-size:0.875rem;font-weight:700;color:var(--ink-2)}
.show__actions .btn{flex:1;min-width:120px;padding:10px 14px;font-size:.9375rem;text-align:center;text-decoration:none}
.th-actions{display:flex;gap:6px;align-items:center}

/* ================= 재구성 A (10/30): 오늘 한 장 · 일정 탭 · 더보기 ================= */
/* 날짜 칩은 일정 탭 안에만, 맨 위 줄은 날짜 + 누구 폰 + 🚑 */
.chap,.stage{display:none!important}
body[data-view="days"] .ticker{display:none}
.whoChip{display:inline-flex;align-items:center;min-height:48px;padding:0 14px;border:0;border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:0.9375rem;font-weight:800;box-shadow:var(--btn-sh);cursor:pointer;white-space:nowrap}
.whoChip[hidden]{display:none}
#v-plan .vhead{padding-bottom:14px}
#v-plan .sub{padding-right:62px}
.wxl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin-top:10px;font-size:0.9375rem;font-weight:700;color:var(--ink-2)}
.wxl__t{margin-left:auto;white-space:nowrap}
.wxl__t b{font-family:var(--f-game);font-weight:400;font-size:1.125rem;color:var(--ink)}
.wxl__t small{font-size:0.8125rem;color:var(--ink-3)}
/* 지금 카드 */
.hero .nowc{box-shadow:inset 0 0 0 2px var(--lan)}
.nowc .meta .eta{margin-left:auto}
.nowc .now-title{margin-top:8px}
.nowc__s{margin-top:4px;font-size:0.9375rem;font-weight:600;color:var(--ink-2);line-height:1.5}
.nowc__todo{margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--chip);color:var(--ink)}
.nowc .acts{margin-top:12px}
.nowc .acts .btn{flex:1 1 0}
.rec{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:7px;background:var(--sea-tint);color:var(--sea-ink);font-family:var(--f-body);font-size:0.75rem;font-weight:800;line-height:1.5;letter-spacing:0;vertical-align:.25em;white-space:nowrap}
.rpk{margin-top:8px;padding:7px 10px;border-radius:12px;background:var(--chip);font-size:0.9375rem;font-weight:800}
.lnkb{padding:0;border:0;background:none;color:var(--sea-ink);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer}

.prows{margin-top:6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

<body data-view="plan">

/* ---------- 일정 ---------- */
var KIND = { flight: '비행', move: '이동', stay: '숙소', food: '식사', walk: '산책', rest: '휴식', spa: '마사지', shop: '장보기', card: '나들이' };
var ALL = [];
/* seen: 일정 목록에 보이는 것(only 는 그 사람만). forMe: 지금·다음·출발 전 띠에 쓰는 것 — trip 이 있는 사람은 합류~귀국 사이 가족 일정 + 자기 only */
function seen(it){ return !it.only || it.only.indexOf(MEID) >= 0; }
function forMe(it){ return it.only ? seen(it) : !MYT || (it._at >= T_ARR && it._at <= T_BACK); }
TRIP.days.forEach(function(d, di){ d.items.forEach(function(it, ii){ it._at = at(d.date, it.t, it.tz); it._end = it.end ? at(d.date, it.end, it.tz) : null; it._id = 'it-' + di + '-' + ii; it._day = di; if (forMe(it)) ALL.push(it); }); });
var curDay = 0, openSet = {};
function nowState(){
  var now = Date.now(), cur = null, next = null;
  for (var i = 0; i < ALL.length; i++){ if (ALL[i]._at <= now) cur = ALL[i]; else { next = ALL[i]; break; } }
  if (now > T_END + 3600000) return { phase: 'after' };
  if (!cur) return { phase: 'before', next: ALL[0] };
  return { phase: 'during', cur: cur, next: next };
}
function itemPlaces(it){ var a = []; if (it.place) a.push(it.place); (it.places || []).forEach(function(k){ if (a.indexOf(k) < 0) a.push(k); }); return a; }
function timeTxt(it){ return (it.approx ? '~' : '') + it.t + (it.end ? '–' + it.end : '') + (it.tz === 'K' ? ' 한국' : ''); }
/* 오늘 탭 머리: 여행 중엔 그날 제목(— 앞은 제목, 뒤는 부제목), 그 밖엔 여행 이름. 누구 폰인지는 맨 위 👤 버튼 */
function renderTitle(){
  var c = crew(me()), wc = $('#whoChip');
  wc.hidden = !c; if (c){ wc.textContent = '👤 ' + c.name; wc.setAttribute('aria-label', '누구 폰인지 바꾸기 — 지금 ' + c.name); }
  var ti = todayIdx(), d = nowState().phase === 'during' && ti >= 0 ? TRIP.days[ti] : null;
  if (d){
    var parts = pv(d.title).split(' — '), head = parts[0], tail = parts.slice(1).join(' — '), ws = head.split(' '), last = ws[ws.length - 1];
    $('#planT').innerHTML = ws.length > 1 && last.length > 1 && !/^\d+$/.test(last) ? esc(ws.slice(0, -1).join(' ')) + ' <em>' + esc(last) + '</em>' : esc(head);
    $('#subT').textContent = tail || TRIP.sub;
    return;
  }

/* 일정 한 줄: 접으면 제목 + 한 줄, 누르면 메모·장소. 미정 칸·미정 식당은 접혀 있어도 「고르기」(아빠·엄마 폰) */
function evHTML(it, st){
  var sv = it.slot ? slotView(it) : null, pk = sv ? sv.places : itemPlaces(it);
  var rk = rOpts(it), rp = rPickAt(it), edit = canPick(), memo = evMemo(it, sv, rp);
  if (rp) pk = [rp].concat(pk.filter(function(k){ return rk.indexOf(k) < 0; }));
  var isNow = st.phase === 'during' && st.cur === it;
  var past = !isNow && (st.phase === 'after' || (st.phase === 'during' && it._at < st.cur._at));
  var more = memo.length > 1 || !!it.alt || pk.length > 0, open = more && !!openSet[it._id];
  var h = '<li class="ev k-' + it.k + (isNow ? ' is-now' : '') + (past ? ' is-past' : '') + (open ? ' is-open' : '') + (more ? '' : ' no-x') + '" id="' + it._id + '"' + (isNow ? ' aria-current="step"' : '') + '>';
  h += '<div class="tm">' + (it.approx ? '~' : '') + it.t + (it.end ? '<small>–' + it.end + '</small>' : '') + (it.tz === 'K' ? '<small class="kst">한국</small>' : '') + '</div><div class="rail" aria-hidden="true"><i></i></div>';
  h += '<div class="ev__c"><div class="ev__h"' + (more ? ' role="button" tabindex="0" aria-expanded="' + open + '" data-ev="' + it._id + '"' : '') + '>';
  h += '<h3 class="ev-t"><span class="cat">' + KIND[it.k] + '</span><span class="ev-tt">' + rich(sv ? sv.title : it.title) + '</span>' + (sv && sv.rec ? '<span class="rec">추천</span>' : '') + (isNow ? ' <span class="tag now">지금</span>' : '') + '</h3>';
  if (rp) h += '<p class="ev-r">' + (it.k === 'spa' ? '💆 ' : '🍽 ') + esc(SP[rp].ko) + '</p>';
  if (memo[0]) h += '<p class="ev-m">' + rich(memo[0]) + '</p>';
  if (more) h += '<span class="chev" aria-hidden="true"></span>';
  h += '</div>';
  var acts = [];
  if (edit && sv && !sv.picked) acts.push('<button class="mini mini--pri" type="button" data-psheet="s|' + it._slot.key + '">' + (sv.rec ? '다른 일정 고르기' : '고르기') + '</button>');
  if (edit && rk.length && !rp) acts.push('<button class="mini mini--pri" type="button" data-psheet="r|' + it._rk + '">' + (it.k === 'spa' ? '💆 마사지 고르기' : '🍽 식당 고르기') + '</button>');
  if (acts.length) h += '<div class="ev__a">' + acts.join('') + '</div>';
  if (more){
    var xa = [];
    if (edit && sv && sv.picked) xa.push('<button class="btn btn--sec btn--sm" type="button" data-psheet="s|' + it._slot.key + '">다른 일정으로 바꾸기</button>');
    if (edit && rk.length && rp) xa.push('<button class="btn btn--sec btn--sm" type="button" data-psheet="r|' + it._rk + '">' + (it.k === 'spa' ? '마사지' : '식당') + ' 바꾸기</button>');
    if (it.dinner) xa.push('<button class="btn btn--sec btn--sm" type="button" data-go="dlv">🛵 배달 가게</button>');
    h += '<div class="ev__x">' + (memo.length > 1 ? '<ul class="ev-ml">' + lis(memo.slice(1)) + '</ul>' : '') + (it.alt ? '<p class="alt">' + rich(it.alt) + '</p>' : '') + spotRows(pk) +
      (xa.length ? '<div class="btnrow">' + xa.join('') + '</div>' : '') + '</div>';
  }
  return h + '</div></li>';
}

/* ---------- 나들이 플랜 풀 — 여행 전체에서 고르고, 고른 것은 다른 날 목록에서 빠진다 ----------
   칸(slot) = 일정의 slot 항목(am·pm·eve). 칸에는 그 시각 숙소 지역(hubAt)의 플랜만. 고른 기록 = localStorage 'pool' { '날짜:칸': { p: 플랜 id 또는 '', t: 고른 시각, by } }
   — 칸마다 나중에 고른 쪽이 이긴다(가족 폰끼리 합칠 때도). 같은 플랜이 두 칸에 있으면(두 폰이 동시에 고름) 나중 것만 살린다. rep 플랜은 몇 번이고 */
var SLOT = { am: '오전', pm: '오후', eve: '저녁' };
var BABY = { easy: ['가벼움', 0], normal: ['보통', 1], big: ['힘듦', 2] };
var BABYC = { good: ['좋음', 2, '전부'], ok: ['보통', 1, '가벼움·보통만'], rest: ['쉬어야 함', 0, '가벼운 것만'] };
var WICON = { sun: '☀', rain: '☔', any: '🌤' };
var WXT = { dry: '☀ 맑음', mid: '🌦 오락가락', wet: '☔ 비' };
var PL = {}, SLOTS = [], SLOTK = {};
TRIP.plans.forEach(function(p, i){ p._i = i; PL[p.id] = p; });
TRIP.days.forEach(function(d){ d.items.forEach(function(it){ if (!it.slot) return; var s = { key: d.date + ':' + it.slot, date: d.date, slot: it.slot, it: it, hub: hubAt(it._at), day: d }; it._slot = s; SLOTS.push(s); SLOTK[s.key] = s; }); });
function slotsOf(date){ return SLOTS.filter(function(s){ return s.date === date; }); }
function slotName(s){ return md(s.date) + ' ' + SLOT[s.slot]; }
var PM = null;
function poolRaw(){ var r = load('pool', {}); return r && typeof r === 'object' ? r : {}; }
function pm(){
  if (PM) return PM;
  var raw = poolRaw(), m = {}, used = {};
  Object.keys(raw).filter(function(k){ var x = raw[k]; return SLOTK[k] && x && x.p && PL[x.p]; })
    .sort(function(a, b){ return (raw[b].t || 0) - (raw[a].t || 0); })
    .forEach(function(k){ var id = raw[k].p; if (!PL[id].rep && used[id]) return; used[id] = k; m[k] = id; });
  PM = { m: m, used: used }; return PM;
}
function pickAt(key){ return pm().m[key] || ''; }
function usedAt(id){ var p = PL[id]; return p && !p.rep ? (pm().used[id] || '') : ''; }
function poolLeft(){ return TRIP.plans.filter(function(p){ return p.rep || !usedAt(p.id); }).length; }
function setPick(key, id){
  var raw = poolRaw(), now = Date.now(), who = me() || '', u = id ? usedAt(id) : '';
  if (u && u !== key) raw[u] = { p: '', t: now, by: who };   /* 다른 칸에 있던 같은 플랜은 그 칸에서 뺀다 */
  raw[key] = { p: id || '', t: now, by: who };
  save('pool', raw); PM = null; poolChanged(); share.sendPool();
}
/* 가족 폰에서 온 것 합치기: { 칸: [id, t, by] } — 칸마다 t 가 더 늦은 것만 */
function mergePool(s, from){
  var raw = poolRaw(), got = [];
  Object.keys(s).forEach(function(k){
    var x = s[k], isR = !SLOTK[k] && !!RK[k]; if ((!SLOTK[k] && !isR) || !Array.isArray(x)) return;
    var id = String(x[0] || ''), t = +x[1] || 0; if (id && !(isR ? SP[id] : PL[id])) return;
    if (raw[k] && (raw[k].t || 0) >= t) return;
    raw[k] = { p: id, t: t, by: crew(String(x[2] || '')) ? String(x[2]) : '' }; got.push(k);
  });
  if (!got.length) return 0;
  save('pool', raw); PM = null; poolChanged();
  var by = crew(from), k0 = got[0], r0 = RK[k0], p0 = r0 ? SP[raw[k0].p] : PL[pickAt(k0)];
  toast((by ? relName(by.id) + ' · ' : '') + (r0 ? rName(r0) + ' ' + (p0 ? p0.ko : '미정') : '나들이 ' + slotName(SLOTK[k0]) + ' ' + (p0 ? p0.title : '비움')) + (got.length > 1 ? ' 외 ' + (got.length - 1) + '칸' : ''));
  return got.length;
}
function poolWire(){ var raw = poolRaw(), o = {}; Object.keys(raw).forEach(function(k){ if ((SLOTK[k] || RK[k]) && raw[k]) o[k] = [raw[k].p || '', raw[k].t || 0, raw[k].by || '']; }); return o; }
function poolChanged(){
  renderCards(); renderTL(); renderHero(); renderTicker();
  if (mapDay && dayByDate(mapDay)) setMapDay(mapDay, false);
}

/* 날씨: 기존 예보 → 추천(advise)을 그대로 — 오전 칸은 오전, 오후·저녁 칸은 오후 블록. 숨기지 않고 정렬·배지만 */
function slotWx(s){ var a = advise(s.hub, s.date); return a ? { c: s.slot === 'am' ? a.am : a.pm, slip: a.slip } : null; }
function fitOf(p, wx, s){
  var isDef = (s.it.def || []).indexOf(p.id) >= 0;
  if (!wx) return { f: isDef ? 1 : 0, tag: isDef ? '기본 배치' : '' };
  if (p.id === 'marble' && wx.slip) return { f: -1, tag: '새벽 비 — 미끄러워요', bad: true };
  var c = wx.c;
  if (p.w === 'sun') return c === 'dry' ? { f: 3, tag: p.cond ? '맑음' : '맑음 · 추천', rec: !p.cond } : c === 'mid' ? { f: 1, tag: '오락가락' } : { f: 0, tag: '비 예보', bad: true };
  if (p.w === 'rain') return c === 'dry' ? { f: 1, tag: '' } : { f: c === 'wet' ? 3 : 2.5, tag: '비 와도 · 추천', rec: true };

var babyC = load('babyc', 'good'); if (!BABYC[babyC]) babyC = 'good';

  var wx = slotWx(s), lim = BABYC[babyC][1], max = s.it.maxH || 0, hidden = 0;

    if ((p.area !== s.hub && p.area !== 'both') || p.slots.indexOf(s.slot) < 0) return false;
    var u = usedAt(p.id); if (u && u !== s.key) return false;
    if (BABY[p.baby][1] > lim){ hidden++; return false; }
    return true;
  }).map(function(p){ return { p: p, f: fitOf(p, wx, s), long: !!(max && p.h > max) }; });
  list.sort(function(a, b){ return (b.f.f - a.f.f) || ((a.long ? 1 : 0) - (b.long ? 1 : 0)) || (a.p._i - b.p._i); });
  return { list: list, hidden: hidden, wx: wx };
}

/* ---------- 미정 칸 · 미정 식당 고르기 (10/30 재구성) — 아빠·엄마 폰만. 아래에서 올라오는 시트 하나로 ----------
   나들이 칸: 고른 플랜 → 없으면 기본 배치(def) 중 그날 예보에 맞는 것을 「추천」으로 일정에 보여 준다(고르지 않아도 일정이 비지 않게).
   식당: 저녁 칸(dinner)의 플랜 안 식당이 둘 이상이거나, 식사·마사지 일정에 장소가 둘 이상이면 그중 하나를 고른다.
   고른 식당도 'pool' 기록에 '날짜@시각' 칸으로 같이 들어가 가족 폰으로 간다(옛 판 폰은 SLOTK 에 없는 칸이라 무시) */

var RK = {};
TRIP.days.forEach(function(d){ d.items.forEach(function(it){
  if ((it.slot && it.dinner) || ((it.k === 'food' || it.k === 'spa') && itemPlaces(it).length > 1)){ it._rk = d.date + '@' + it.t; RK[it._rk] = it; }
}); });
function rOpts(it){
  if (!it._rk) return [];
  var ks;
  if (it.slot){ var sv = slotView(it); ks = sv.plan ? (sv.plan.places || []) : []; }
  else ks = itemPlaces(it);
  var want = it.k === 'spa' ? ['spa'] : ['food', 'cafe'];
  ks = ks.filter(function(k){ return SP[k] && want.indexOf(SP[k].kind) >= 0; });
  return ks.length > 1 ? ks : [];
}
function rPickAt(it){ if (!it._rk) return ''; var x = poolRaw()[it._rk], o = rOpts(it); return x && x.p && o.indexOf(x.p) >= 0 ? x.p : ''; }
function setRPick(rk, sp){
  var raw = poolRaw(); raw[rk] = { p: sp || '', t: Date.now(), by: me() || '' };
  save('pool', raw); PM = null; poolChanged(); share.sendPool();
}
function rName(it){ var d = TRIP.days[it._day]; return md(d.date) + ' ' + it.t + ' ' + (it.k === 'spa' ? '마사지' : it.slot ? SLOT[it.slot] : '식사'); }
/* 고른 것이 없을 때 일정에 보여 줄 추천: def 중 다른 칸에 안 들어간 것, 예보가 있으면 그날 날씨에 맞는 쪽 */
function recPlan(it){
  var s = it._slot, defs = (it.def || []).filter(function(x){ var u = usedAt(x); return PL[x] && (!u || u === s.key); });
  if (!defs.length) return null;

  if (wx && defs.length > 1) defs = defs.slice().sort(function(a, b){ return fitOf(PL[b], wx, s).f - fitOf(PL[a], wx, s).f; });
  return { p: PL[defs[0]], alt: defs.slice(1).map(function(x){ return PL[x].title; }) };
}
/* 일정·지금 카드에서 칸 보기: 고른 플랜 → 추천 → 칸 제목(비워 둬도 되는 오후 칸) */
function slotView(it){
  var s = it._slot, p = PL[pickAt(s.key)], im = it.memo || [];
  if (p) return { title: p.title, plan: p, picked: true, rec: false, memo: [p.sub].concat(p.eat || [], p.memo || [], im), memoR: (p.eatSub ? [] : [p.sub]).concat(p.memo || [], im), places: p.places || [] };
  var r = recPlan(it);
  if (r) return { title: r.p.title, plan: r.p, picked: false, rec: true, memo: [r.p.sub].concat(r.alt.length ? ['또는 **' + r.alt.join('** · **') + '**'] : [], r.p.eat || [], r.p.memo || [], im), memoR: (r.p.eatSub ? [] : [r.p.sub]).concat(r.p.memo || [], im), places: r.p.places || [] };

function itTitle(it){ return it.slot ? slotView(it).title : it.title; }
/* 일정 한 줄의 메모: 식당을 골랐으면 그 식당 한 줄(menus) + 고르기용 글을 뺀 메모, 아니면 고르기용 글까지 */

var pkMore = {}, pkOpen = {};

function sheetHead(k, t){ return '<div class="ps__h"><div><p class="ps__k">' + k + '</p><h3 class="ps__t">' + t + '</h3></div><button class="ps__x" type="button" data-psx aria-label="닫기">✕</button></div>'; }

  var loc = r.seq.filter(function(s){ return !s.far; }), pts = loc.map(function(s){ return SP[s.k].ll; });

  var la0 = Math.min.apply(null, la), la1 = Math.max.apply(null, la), lo0 = Math.min.apply(null, lo), lo1 = Math.max.apply(null, lo);
  var K = Math.cos((la0 + la1) / 2 * Math.PI / 180), MD = 111320, cx = (lo0 + lo1) / 2, cy = (la0 + la1) / 2;
  var sc = Math.min((W - 48) / Math.max((lo1 - lo0) * K * MD, 900), (H - 64) / Math.max((la1 - la0) * MD, 600)), tx = W / 2, ty = H / 2;   /* sc = 화면 px / m */

  function path(arr, close){ return arr.map(function(p, i){ var q = P(p); return (i ? 'L' : 'M') + f1(q[0]) + ' ' + f1(q[1]); }).join('') + (close ? 'Z' : ''); }

    var ms = [];

      if (!s.anchor) ms.forEach(function(x){ if (!m && !x.anchor && Math.hypot(x.x - q[0], x.y - q[1]) < 22) m = x; });
      if (m){ m.ks.push(s.k); m.txt += '·' + routeSym(s); m.names.push(shortName(s.k)); }
      else ms.push({ ks: [s.k], ll: SP[s.k].ll, x: q[0], y: q[1], anchor: s.anchor, txt: routeSym(s), names: [shortName(s.k)] });

    });

    tx = W / 2 - (x0 + x1) / 2; ty = (H - 22) / 2 + 4 - (y0 + y1) / 2;
    if (x1 - x0 <= AW && y1 - y0 <= AH) break;
    sc *= Math.max(0.5, Math.min(AW / (x1 - x0), AH / (y1 - y0)) * 0.97);
  }

  var h = '<svg class="rmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(routeTitle(r)) + ' 경로 그림">';
  h += '<rect class="rm-land" width="' + W + '" height="' + H + '"/><path class="rm-sea" d="' + path(g.sea, true) + '"/>';
  g.islands.forEach(function(isl){ h += '<path class="rm-land" d="' + path(isl, true) + '"/>'; });
  if (g.water && g.water.length) h += '<path class="rm-sea" fill-rule="evenodd" d="' + g.water.map(function(rg){ return path(rg, true); }).join('') + '"/>';
  g.rivers.forEach(function(rv){ h += '<path class="rm-river" stroke-width="' + f1(Math.max(1.4, rv.w * sc)) + '" d="' + path(rv.p) + '"/>'; });
  /* 점선 경로 (먼 곳까지 그리고 틀 밖은 잘린다) */
  var all = r.seq.map(function(s){ return SP[s.k].ll; });
  h += '<path class="rm-route-c" d="' + path(all) + '"/><path class="rm-route" d="' + path(all) + '"/>';
  var bars = [100, 200, 500, 1000, 2000, 5000, 10000], bm = bars[0];
  bars.forEach(function(b){ if (b * sc <= W * 0.22) bm = b; });
  h += '<g class="rm-scale"><path d="M12 ' + (H - 12) + 'h' + f1(bm * sc) + '"/><text x="12" y="' + (H - 17) + '">' + (bm >= 1000 ? bm / 1000 + 'km' : bm + 'm') + '</text></g>';

  marks.forEach(function(m){ boxes.push([m.x - m.w / 2, m.y - m.r, m.x + m.w / 2, m.y + m.r]); });
  /* 먼 곳: 숙소 → 그쪽으로 틀 가장자리에 화살표 + 이름표 */

    var t = Math.min(ux > 0 ? (W - M - home[0]) / ux : ux < 0 ? (M - home[0]) / ux : Infinity, uy > 0 ? (H - M - home[1]) / uy : uy < 0 ? (M - home[1]) / uy : Infinity);
    var ex = home[0] + ux * t, ey = home[1] + uy * t, txt = (routeSym(s) === '✈' ? '✈ ' : '★ ') + shortName(s.k) + ' ' + (r.farTxt[s.k] || '');

    [0, -36, 36, -72, 72, -108, 108, -144, 144].forEach(function(off){
      var x = Math.max(4, Math.min(W - 4 - w, ex - ux * 18 - w / 2 + (side ? 0 : off))), y = Math.max(4, Math.min(H - 26, ey - uy * 18 - 11 + (side ? off : 0))), sc2 = Math.abs(off) / 36;
      marks.forEach(function(m){ sc2 += overlap([x, y, x + w, y + 22], [m.x - m.w / 2 - 4, m.y - m.r - 4, m.x + m.w / 2 + 4 + m.lw, m.y + m.r + 4]) * 3; });
      boxes.forEach(function(q){ sc2 += overlap([x, y, x + w, y + 22], q) * 3; });
      if (sc2 < bs){ bs = sc2; bx = x; by = y; }
    });
    h += '<g class="rm-far"><path d="M' + f1(ex + ux * 7) + ' ' + f1(ey + uy * 7) + 'L' + f1(ex - ux * 5 - uy * 7) + ' ' + f1(ey - uy * 5 + ux * 7) + 'L' + f1(ex - ux * 5 + uy * 7) + ' ' + f1(ey - uy * 5 - ux * 7) + 'Z"/>' +
      '<rect x="' + f1(bx) + '" y="' + f1(by) + '" width="' + f1(w) + '" height="22" rx="11"/><text x="' + f1(bx + 7) + '" y="' + f1(by + 16) + '">' + esc(txt) + '</text></g>';
    boxes.push([bx, by, bx + w, by + 22]);
  });
  marks.forEach(function(m){
    var b = placeLabel(m.x, m.y, m.w / 2, m.lw, 17, boxes, W, H);
    boxes.push(b);
    labels += '<text class="rm-l" x="' + f1(b[0] + 2) + '" y="' + f1(b[1] + 13) + '">' + esc(m.name) + '</text>';
    dots += '<g class="rm-stop' + (m.anchor ? ' is-stay' : '') + '">' + (m.w > m.r * 2 ? '<rect x="' + f1(m.x - m.w / 2) + '" y="' + f1(m.y - m.r) + '" width="' + f1(m.w) + '" height="' + m.r * 2 + '" rx="' + m.r + '"/>' : '<circle cx="' + f1(m.x) + '" cy="' + f1(m.y) + '" r="' + m.r + '"/>') +
      '<text class="rm-n" x="' + f1(m.x) + '" y="' + f1(m.y + 4.5) + '">' + esc(m.txt) + '</text></g>';
  });
  return h + dots + labels + '</svg>';
}

function mapRouteLayers(){

    map.addLayer({ id: 'route', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#E2483B', 'line-width': 4, 'line-dasharray': [0.1, 2] } });

  mapRt.seq.forEach(function(s){ if (!uniq.some(function(u){ return u.k === s.k; })) uniq.push(s); });
  uniq.forEach(function(s){
    var p = map.project([SP[s.k].ll[1], SP[s.k].ll[0]]), g = null;
    groups.forEach(function(x){ if (!g && !(x.anchor && s.anchor) && Math.hypot(x.p.x - p.x, x.p.y - p.y) < 30) g = x; });

function wmo(c){ return c === 0 ? ['☀️', '맑음'] : c === 1 ? ['🌤️', '대체로 맑음'] : c === 2 ? ['⛅', '구름 조금'] : c === 3 ? ['☁️', '흐림'] : c <= 48 ? ['🌫️', '안개'] : c <= 57 ? ['🌦️', '이슬비'] : c <= 67 ? ['🌧️', '비'] : c <= 77 ? ['🌨️', '눈'] : c <= 82 ? ['🌧️', '소나기'] : ['⛈️', '뇌우']; }

}
function worst(a, b){ return (a.c === 'wet' || b.c === 'wet') ? 'wet' : (a.c === 'mid' || b.c === 'mid') ? 'mid' : 'dry'; }
/* 그날 오전·오후를 맑음(dry)·오락가락(mid)·비(wet)로 — 나들이 플랜 정렬·배지(fitOf)의 근거 */

function doseInfo(){
  var L = load('fev', []), now = Date.now(), out = [];
  TRIP.meds.forEach(function(m){
    var g = L.filter(function(e){ return e.med === m.id; }).sort(function(a, b){ return b.t - a.t; });
    if (!g.length || now - g[0].t > 24 * 3600000) return;
    var cnt = g.filter(function(e){ return now - e.t <= 24 * 3600000; }).length;

/* ================================================================

var share = (function(){

  function b64(u){ var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

    var topic = 'dn' + Array.prototype.map.call(h.slice(0, 12), function(b){ return (b < 16 ? '0' : '') + b.toString(16); }).join('');

    keys = { topic: topic, key: key }; keysFor = code; return keys;

  async function take(m){
    if (!m || m.event !== 'message' || !m.message) return;

function collectQ(){
  var out = [];
  function walk(v, label){
    if (typeof v === 'string'){ if (v.indexOf('{?') >= 0) out.push((label ? label + ' — ' : '') + plain(v)); return; }
    if (Array.isArray(v)) { v.forEach(function(x){ walk(x, label); }); return; }
    if (v && typeof v === 'object') Object.keys(v).forEach(function(k){ if (k.charAt(0) !== '_') walk(v[k], v.name || (v.title ? plain(v.title) : '') || v.t || label); });
  }
  walk(TRIP.days, ''); walk(TRIP.stays, '숙소'); walk(TRIP.plans, ''); walk(TRIP.flood, '침수'); walk(TRIP.move, '이동'); walk(TRIP.sos, '비상'); walk(TRIP.lists, ''); walk(TRIP.medNote, '해열제'); walk(TRIP.tips, ''); walk(TRIP.delivery, '배달');
  var seen = {}; return out.filter(function(x){ if (seen[x]) return false; seen[x] = 1; return true; });
}
